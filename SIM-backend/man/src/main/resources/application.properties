spring.application.name=man
# MongoDB Configuration — use environment variable; falls back to local dev DB
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://vishaalsaravanakumar:kudos@hackathon.6bhlwxe.mongodb.net/inventorydb?retryWrites=true&w=majority&appName=Hackathon}
spring.data.mongodb.auto-index-creation=true

# Actuator endpoints — restrict exposure; never show internal details publicly
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration — MUST be set via environment variable in production
jwt.secret=${JWT_SECRET:default-dev-secret-change-me-in-production-min-32chars}
jwt.expiration=86400000

spring.security.filter.order=10

# Server Port (fixed numeric value for local runs)
server.port=8080
server.servlet.context-path=/

# CORS CONFIGURATION (for React)
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# LOGGING CONFIGURATION
logging.level.org.springframework=INFO
logging.level.com.inv.man=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

#Mail Sender — credentials MUST be set via environment variables in production
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
